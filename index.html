<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#F8FBF7" />
    <title>Άνοδος</title>
    <link rel="manifest" href="./manifest.webmanifest?v=7" />
    <link rel="icon" href="./assets/icon.svg?v=7" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png?v=7" sizes="180x180" />
    <link rel="stylesheet" href="./styles.css?v=149" />
  </head>
  <body>
    <div class="splash" id="splash" aria-hidden="true">
      <div class="splash-grid"></div>
      <section class="splash-lockup" aria-label="Anodos — висхідний шлях">
        <svg class="splash-mark" viewBox="0 0 184 132" role="img" aria-label="Anodos — висхідний шлях">
          <path class="mark-path" d="M18 112C49 109 72 94 88 72C104 50 124 34 158 20" />
          <circle class="mark-halo" cx="166" cy="17" r="5.25" />
          <circle class="mark-dot" cx="166" cy="17" r="5.25" />
        </svg>
        <p class="splash-name">Άνοδος</p>
      </section>
    </div>

    <main class="app-shell" id="app" aria-label="Άνοδος" aria-hidden="true">
      <header class="topbar">
        <div class="brand-menu-shell">
          <button class="brand-lockup" type="button" data-brand-menu aria-haspopup="menu" aria-expanded="false" aria-label="Обрати простір Anodos">
            <span class="brand-name">Άνοδος</span>
            <span class="brand-space">
              <span data-current-space-label>Навчання</span>
              <span class="brand-space-chevron" aria-hidden="true">⌄</span>
            </span>
          </button>
          <div class="brand-menu" data-brand-menu-panel role="menu" aria-label="Простори та інструменти Anodos" hidden>
            <p class="brand-menu-title">Оберіть простір</p>
            <button type="button" role="menuitemradio" aria-checked="true" data-brand-menu-space="learning">
              <span>
                <strong>Навчання</strong>
                <small>Відео, конспекти, задачі та тести</small>
              </span>
              <span class="brand-menu-check" aria-hidden="true"></span>
            </button>
            <button type="button" role="menuitemradio" aria-checked="false" data-brand-menu-space="products">
              <span>
                <strong>Продукти</strong>
                <small>Робочі матеріали, закон і договори</small>
              </span>
              <span class="brand-menu-check" aria-hidden="true"></span>
            </button>
            <div class="brand-menu-divider" aria-hidden="true"></div>
            <p class="brand-menu-title brand-menu-tool-title">Робочий інструмент</p>
            <button class="brand-menu-tool" type="button" role="menuitem" data-brand-menu-route="contract-review">
              <span>
                <strong>Перевірка договорів</strong>
                <small>Завантажити й порівняти версії</small>
              </span>
              <span class="brand-menu-arrow" aria-hidden="true">→</span>
            </button>
            <button class="brand-menu-tool" type="button" role="menuitem" data-brand-menu-route="bank-accreditation">
              <span>
                <strong>Акредитація в банках</strong>
                <small>Знайти страховиків для застави</small>
              </span>
              <span class="brand-menu-arrow" aria-hidden="true">→</span>
            </button>
            <button class="brand-menu-tool" type="button" role="menuitem" data-brand-menu-route="questionnaire-generator">
              <span>
                <strong>Генератор опитувальників</strong>
                <small>Підготувати опитувальник BritMark</small>
              </span>
              <span class="brand-menu-arrow" aria-hidden="true">→</span>
            </button>
            <button class="brand-menu-tool" type="button" role="menuitem" data-brand-menu-route="client-recommendation" data-private-client-recommendation hidden>
              <span>
                <strong>Рекомендація Клієнту</strong>
                <small>Підготувати брокерський висновок</small>
              </span>
              <span class="brand-menu-arrow" aria-hidden="true">→</span>
            </button>
          </div>
        </div>

        <button class="progress-orb compass-orb" type="button" data-open-compass aria-haspopup="dialog" aria-expanded="false" aria-label="Компас Anodos">
          <span id="progressValue" class="compass-orb-mark" aria-hidden="true">
            <svg viewBox="0 0 46 46" focusable="false">
              <path class="compass-path" d="M14.5 36C16.4 30.2 19.6 27.4 23.8 24.1C29 20 30.7 15.3 30.7 8.2" />
              <path class="compass-arrow" d="M27.1 11.4L30.7 7.9L34 11.8" />
              <circle class="compass-dot" cx="30.7" cy="6.7" r="3" />
            </svg>
          </span>
        </button>

        <a class="partner-lockup" href="https://brit-mark.com/" target="_blank" rel="noopener" aria-label="BritMark">
          <span class="partner-name">BritMark</span>
        </a>
      </header>

      <section id="compassPanel" class="compass-panel" aria-label="Компас Anodos" hidden></section>

      <section id="screen" class="screen" aria-live="polite"></section>

      <nav class="bottom-nav" aria-label="Навігація">
        <button type="button" data-route="home" class="nav-item nav-item-active">Навчання</button>
        <button type="button" data-route="progress" class="nav-item">Прогрес</button>
      </nav>
    </main>

    <script src="./law-data.js?v=3"></script>
    <script src="./munich-re-clauses.js?v=1"></script>
    <script src="./sync-config.js?v=1"></script>
    <script src="./assets/vendor/jszip.min.js?v=1"></script>
    <script src="./questionnaire-generator.js?v=9"></script>
    <script src="./client-recommendation.js?v=1"></script>
    <script src="./bank-accreditation-data.js?v=3"></script>
    <script src="./app.js?v=175"></script>
  </body>
</html>
